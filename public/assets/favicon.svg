<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Cipher Mail">
  <!-- Glyphe : Fontisto « email » — MIT, Kenan Gundogan (kenangundogan/fontisto) -->
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0.7" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#2A3648"/>
      <stop offset="0.5" stop-color="#161D29"/>
      <stop offset="1" stop-color="#0A0E15"/>
    </linearGradient>
    <linearGradient id="glyph" x1="0" y1="0" x2="0.2" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#CBDCF6"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0.6" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#6FA8FF" stop-opacity="0.30"/>
      <stop offset="0.55" stop-color="#6FA8FF" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#6FA8FF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round">
      <rect width="64" height="64" rx="15"/>
    </clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="64" height="64" fill="url(#plate)"/>
    <rect width="64" height="64" fill="url(#sheen)"/>

    <!-- tranche lumineuse -->
    <path d="M0 15A15 15 0 0 1 15 0h34a15 15 0 0 1 15 15" fill="none"
          stroke="#FFFFFF" stroke-opacity="0.16" stroke-width="1.1"/>

    <!-- glyphe : boîte englobante réelle x≈1.35→22.65, y≈3.18→19.64 -->
    <!-- mise à l'échelle 1.30 puis centrage optique dans la plaque -->
    <g transform="translate(15.55 14.75) scale(1.30)" fill="url(#glyph)">
      <path d="m16.484 11.976 6.151-5.344v10.627zm-7.926.905 2.16 1.875c.339.288.781.462 1.264.462h.017-.001.014c.484 0 .926-.175 1.269-.465l-.003.002 2.16-1.875 6.566 5.639h-20.009zm-6.572-7.516h20.03l-9.621 8.356c-.104.082-.236.132-.38.132-.005 0-.009 0-.014 0h.001c-.004 0-.009 0-.014 0-.144 0-.277-.05-.381-.133l.001.001zm-.621 1.266 6.15 5.344-6.15 5.28zm21.6-2.441c-.24-.12-.522-.19-.821-.19h-20.285c-.3.001-.584.071-.835.197l.011-.005c-.618.309-1.035.937-1.035 1.663v.004 12.168c.001 1.026.833 1.857 1.858 1.858h20.283c1.026-.001 1.857-.833 1.858-1.858v-12.168c0-.001 0-.002 0-.004 0-.727-.419-1.357-1.029-1.66l-.011-.005z"/>
    </g>
  </g>
</svg>
